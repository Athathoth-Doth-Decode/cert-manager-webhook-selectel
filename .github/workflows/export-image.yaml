name: Export Selectel image for Zot

on:
  push:
    branches: [homenet/build]
    paths: [.github/workflows/export-image.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: homenet-selectel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: github.repository == 'Athathoth-Doth-Decode/cert-manager-webhook-selectel' && github.ref == 'refs/heads/homenet/build'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/docker-auth
      SOURCE: ghcr.io/athathoth-doth-decode/cert-manager-webhook-selectel@sha256:c6b6e4c1cb03a35c5a00dbd1b863e5dc65365672a723ad6a60267a1af8c6ece5
    steps:
      - name: Log in with the repository workflow token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export the exact image without recompressing layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oci-transfer"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$DOCKER_CONFIG/config.json:/auth.json:ro" \
            --volume "$RUNNER_TEMP/oci-transfer:/transfer" \
            quay.io/skopeo/stable@sha256:a585e4a3b8a045baa87c7f1b2f940d6d299ebede85ab3f2419d52d2264eefc93 \
            copy --all --preserve-digests --src-authfile /auth.json \
            "docker://$SOURCE" dir:/transfer/image
          tar -C "$RUNNER_TEMP/oci-transfer" -cf "$RUNNER_TEMP/selectel-image.tar" image

      - name: Save the image for upload to the internal Zot registry
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selectel-webhook-image
          path: ${{ runner.temp }}/selectel-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
